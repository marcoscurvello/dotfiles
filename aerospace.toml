#####################
### Init settings
#####################

config-version = 2
start-at-login = true
after-startup-command = [
    # JankyBorders with monitor-aware configuration
    # Portrait monitor - purple accent
    # Main monitor - green accent
    # Built-in - transparent when others connected
    'exec-and-forget borders active_color=0xff90ee90 inactive_color=0x00000000 width=6.0',
    'workspace 1',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Different accordion padding for portrait vs landscape
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
persistent-workspaces = ['1', '2', '3', 'B', 'C', 'M', 'P', 'X', 'U']
on-focus-changed = [
    # Dynamic border colors based on monitor number
    'exec-and-forget focused_monitor=$(aerospace list-monitors --focused --format "%{monitor-id}"); if [[ "$focused_monitor" == "1" ]]; then borders active_color=0xffbd93f9 width=6.0; elif [[ "$focused_monitor" == "2" ]]; then borders active_color=0xff90ee90 width=6.0; else borders active_color=0xff90ee90 width=4.0; fi',
]

#####################
### Monitor-specific gaps
#####################
[gaps]
# Monitor 1 (Portrait): tighter gaps for maximum vertical real estate
# Monitor 2 (Main): balanced gaps for comfortable viewing
# Monitor 3 (Built-in): minimal gaps to maximize limited screen space
inner.horizontal = [{ monitor.1 = 4 }, { monitor.2 = 8 }, { monitor.3 = 3 }, 6]
inner.vertical = [{ monitor.1 = 4 }, { monitor.2 = 8 }, { monitor.3 = 3 }, 6]
outer.left = [{ monitor.1 = 3 }, { monitor.2 = 8 }, { monitor.3 = 2 }, 5]
outer.bottom = [{ monitor.1 = 3 }, { monitor.2 = 8 }, { monitor.3 = 2 }, 5]
outer.top = [{ monitor.1 = 3 }, { monitor.2 = 8 }, { monitor.3 = 2 }, 5]
outer.right = [{ monitor.1 = 3 }, { monitor.2 = 8 }, { monitor.3 = 2 }, 5]

#####################
### Workspace to monitor assignment (soft enforcement)
#####################
[workspace-to-monitor-force-assignment]
# Monitor 1 (Portrait) - Terminal, Docs, Communication
# 1 = 1      # Terminal/Ghostty/iTerm - Commented out to allow moving
# 2 = 1      # Documentation/Reference - Commented out to allow moving
# C = 1      # Communication (Slack/Discord)

# Monitor 2 (Main/External) - Primary development
# P = 2     # Programming (VS Code/Cursor) - Commented out to allow moving
# X = 2 # Xcode
# B = 2     # Browser
# 3 = 2     # General/Simulator - Commented out to allow moving

# Monitor 3 (Built-in) - Media and utilities
M = 3 # Media/Music
U = 3 # Utilities

#####################
### Main mode settings
#####################

[mode.main.binding]
# Mode switching
alt-esc = ['mode move']
alt-space = ['mode open']
alt-s = ['mode service']
alt-shift-s = ['mode monitor'] # New monitor management mode

# Layout controls
alt-slash = ['layout tiles horizontal vertical']
alt-comma = ['layout accordion horizontal vertical']
alt-period = ['layout floating tiling']
alt-f = ['fullscreen']
ctrl-alt-f = ['layout accordion tiles']

# Focus navigation
alt-left = ['focus left']
alt-down = ['focus down']
alt-up = ['focus up']
alt-right = ['focus right']
alt-tab = ['workspace-back-and-forth']

# Direct monitor focus
alt-shift-1 = ['focus-monitor 1'] # Focus portrait monitor
alt-shift-2 = ['focus-monitor 2'] # Focus main monitor
alt-shift-3 = ['focus-monitor 3'] # Focus built-in

# Monitor-aware window movement - Removed to preserve macOS text selection
# alt-shift-left = ['move-node-to-monitor left']
# alt-shift-right = ['move-node-to-monitor right']
# alt-shift-up = ['move-node-to-monitor up']
# alt-shift-down = ['move-node-to-monitor down']

# Workspace switching
alt-1 = ['workspace 1']
alt-2 = ['workspace 2']
alt-3 = ['workspace 3']
alt-b = ['workspace B']
alt-c = [
    'workspace C',
    'layout tiles vertical',
] # Auto-vertical for communication
alt-x = ['workspace X']
alt-p = ['workspace P']
alt-u = ['workspace U']
alt-m = ['workspace M']

# Special: Balance communication apps in vertical split
ctrl-alt-c = ['workspace C', 'balance-sizes']

# Monitor cycling
alt-semicolon = ['focus-monitor --wrap-around next']

# Resize
alt-minus = ['resize smart -30']
alt-equal = ['resize smart +30']
alt-0 = ['balance-sizes']

#####################
### Monitor mode (NEW) - for monitor-specific operations
#####################

[mode.monitor.binding]
esc = ['mode main']

# Clamshell mode reorganization
c = [
    'exec-and-forget noti -t aerospace -m "Reorganizing for clamshell mode"',
    'move-workspace-to-monitor --workspace M 1',                              # Move media to portrait
    'move-workspace-to-monitor --workspace U 1',                              # Move utilities to portrait
    'mode main',
]

# Extended desktop mode restoration
e = [
    'exec-and-forget noti -t aerospace -m "Restoring extended desktop layout"',
    'move-workspace-to-monitor --workspace 1 1',
    'move-workspace-to-monitor --workspace C 1',
    'move-workspace-to-monitor --workspace P 2',
    'move-workspace-to-monitor --workspace B 2',
    'move-workspace-to-monitor --workspace M 3',
    'move-workspace-to-monitor --workspace U 3',
    'mode main',
]

# Quick workspace redistribute
r = [
    'exec-and-forget aerospace list-workspaces --monitor 1 --empty no | xargs -I {} aerospace move-workspace-to-monitor --workspace {} 2',
    'exec-and-forget noti -t aerospace -m "Redistributed workspaces"',
    'mode main',
]

# Focus follows active workspace
f = [
    'exec-and-forget noti -t aerospace -m "Active workspace will follow monitor focus"',
    'mode main',
]

#####################
### Service mode settings
#####################

[mode.service.binding]
esc = [
    'reload-config',
    'exec-and-forget noti -t aerospace -m "Config reloaded! Back to main mode."',
    'mode main',
]
p = [
    'exec-and-forget noti -t aerospace -m "Toggled Aerospace"',
    'enable toggle',
]
b = [
    'exec-and-forget brew services restart borders',
    'exec-and-forget noti -t aerospace -m "Restarted borders! Back to main mode."',
    'mode main',
]
r = [
    'flatten-workspace-tree',
    'exec-and-forget noti -t aerospace -m "Reset layout tree! Back to main mode."',
    'mode main',
]
backspace = [
    'close-all-windows-but-current',
    'exec-and-forget noti -t aerospace -m "Closed all other windows! Back to main mode."',
    'mode main',
]

# Monitor-specific resets
1 = [
    'exec-and-forget aerospace list-windows --workspace focused | xargs -I {} aerospace close --window-id {}',
    'mode main',
]
2 = [
    'exec-and-forget aerospace list-workspaces --monitor 2 | xargs -I {} aerospace workspace {} && aerospace flatten-workspace-tree',
    'mode main',
]

#####################
### Move mode settings
#####################

[mode.move.binding]
esc = ['mode main']

# Standard movement
left = ['move left']
down = ['move down']
up = ['move up']
right = ['move right']

# Join operations
alt-left = ['join-with left']
alt-down = ['join-with down']
alt-up = ['join-with up']
alt-right = ['join-with right']

# Move to workspace and follow
alt-1 = ['move-node-to-workspace 1', 'workspace 1', 'mode main']
alt-2 = ['move-node-to-workspace 2', 'workspace 2', 'mode main']
alt-3 = ['move-node-to-workspace 3', 'workspace 3', 'mode main']
alt-b = ['move-node-to-workspace B', 'workspace B', 'mode main']
alt-c = ['move-node-to-workspace C', 'workspace C', 'mode main']
alt-m = ['move-node-to-workspace M', 'workspace M', 'mode main']
alt-p = ['move-node-to-workspace P', 'workspace P', 'mode main']
alt-x = ['move-node-to-workspace X', 'workspace X', 'mode main']
alt-u = ['move-node-to-workspace U', 'workspace U', 'mode main']

# Move to workspace without following
ctrl-alt-1 = ['move-node-to-workspace 1', 'mode main']
ctrl-alt-2 = ['move-node-to-workspace 2', 'mode main']
ctrl-alt-3 = ['move-node-to-workspace 3', 'mode main']
ctrl-alt-b = ['move-node-to-workspace B', 'mode main']
ctrl-alt-c = ['move-node-to-workspace C', 'mode main']
ctrl-alt-m = ['move-node-to-workspace M', 'mode main']
ctrl-alt-p = ['move-node-to-workspace P', 'mode main']
ctrl-alt-x = ['move-node-to-workspace X', 'mode main']
ctrl-alt-u = ['move-node-to-workspace U', 'mode main']

# Move entire workspace to different monitor
alt-tab = ['move-workspace-to-monitor --wrap-around next', 'mode main']
shift-tab = ['move-workspace-to-monitor --wrap-around prev', 'mode main']

# Direct workspace to monitor movement
1 = ['move-workspace-to-monitor 1', 'mode main'] # Move to Monitor 1 (Portrait)
2 = ['move-workspace-to-monitor 2', 'mode main'] # Move to Monitor 2 (Main)
3 = ['move-workspace-to-monitor 3', 'mode main'] # Move to Monitor 3 (Built-in)

#####################
### Open mode settings
#####################

[mode.open.binding]
esc = ['mode main']

enter = ['exec-and-forget open -a /Applications/iTerm.app', 'mode main']
alt-enter = ['exec-and-forget open -n /Applications/iTerm.app', 'mode main']
b = ['exec-and-forget open -a /Applications/Safari.app', 'mode main']
alt-b = ['exec-and-forget open -n /Applications/Safari.app', 'mode main']
s = ['exec-and-forget open -a /Applications/Slack.app', 'mode main']
d = ['exec-and-forget open -a /Applications/Discord.app', 'mode main']
x = ['exec-and-forget open -a /Applications/Xcode-16.0.0.app', 'mode main']
m = ['exec-and-forget open -a /Applications/Spotify.app', 'mode main']

#####################
### Window Detection Rules
#####################

# Terminal - Always to workspace 1 on portrait
[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'layout floating'

# Documentation tools to portrait monitor
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 2'

# Communication - Portrait monitor with split arrangement
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = 'move-node-to-workspace C'

# Browsers - Main monitor
[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace B'

# Development - Main monitor
[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace P'

[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'
run = 'move-node-to-workspace P'

# Xcode - Main monitor
[[on-window-detected]]
if.app-id = 'com.apple.dt.Xcode'
run = 'move-node-to-workspace X'

# iOS Simulator - To workspace 3
[[on-window-detected]]
if.app-id = 'com.apple.iphonesimulator'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.marcoscurvello.SimInspector'
run = 'move-node-to-workspace 2'

# Media - Built-in display (or portrait in clamshell)
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if.app-id = 'org.videolan.vlc'
run = 'move-node-to-workspace M'

# Utilities - Built-in display (or portrait in clamshell)
[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'
run = 'move-node-to-workspace U'

[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = 'move-node-to-workspace U'

[[on-window-detected]]
if.app-id = 'com.dygmalab.bazecor'
run = 'move-node-to-workspace U'

[[on-window-detected]]
if.app-id = 'com.proxyman.NSProxy'
run = 'move-node-to-workspace U'
