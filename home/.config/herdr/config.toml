onboarding = false

[ui]
agent_panel_sort = "priority"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
window_title = "{workspace} · {tab} · {pane}"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab", "pane"],
  ["agent"],
]

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[session]
resume_agents_on_restore = true

[keys]
switch_tab = ["prefix+1..9", "cmd+shift+1..9"]

focus_pane_left = ["prefix+h", "cmd+shift+h"]
focus_pane_down = ["prefix+j", "cmd+shift+j"]
focus_pane_up = ["prefix+k", "cmd+shift+k"]
focus_pane_right = ["prefix+l", "cmd+shift+l"]

next_tab = ["prefix+n", "cmd+shift+]"]
previous_tab = ["prefix+p", "cmd+shift+["]

[theme]
name = "dracula"
auto_switch = false
